<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NVT 价格监控</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --border: #e5e7eb;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --up: #16a34a;
      --down: #dc2626;
      --warn: #b45309;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .banner {
      background: #fef3c7;
      color: var(--warn);
      padding: 10px 20px;
      font-size: 14px;
      display: none;
    }
    .banner.show { display: block; }
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      margin-left: auto;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted);
      display: inline-block;
    }
    .dot.ok { background: var(--up); }
    .dot.err { background: var(--danger); }
    .dot.dead { background: var(--warn); }
    main { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      cursor: pointer;
      transition: box-shadow .15s, transform .15s;
      position: relative;
    }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); transform: translateY(-1px); }
    .card .name { font-weight: 600; font-size: 15px; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
    .card .type { font-size: 12px; color: var(--muted); font-weight: 400; }
    .price { font-size: 24px; font-weight: 700; margin: 6px 0; }
    .price .up { color: var(--up); }
    .price .down { color: var(--down); }
    .meta { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 12px; font-weight: 500;
    }
    .badge.active { background: #ecfdf5; color: var(--up); }
    .badge.inactive { background: #fef2f2; color: var(--down); }
    .badge.new { background: #eff6ff; color: #2563eb; }
    .changed-tag { position: absolute; top: 12px; right: 12px; font-size: 12px; }
    .changed-tag.up { color: var(--up); }
    .changed-tag.down { color: var(--down); }
    .changed-tag.new { color: #2563eb; }
    .spark-wrap { position: relative; height: 40px; margin-top: 10px; }
    .spark { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
    .section-title { font-size: 15px; font-weight: 600; margin: 8px 0 12px; }
    .events {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .event {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 13px;
    }
    .event:last-child { border-bottom: none; }
    .event .time { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .event .tag { font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
    .event .tag.price_change { background: #fee2e2; color: var(--down); }
    .event .tag.stock_change { background: #e0f2fe; color: #0369a1; }
    .event .tag.status_change { background: #fef3c7; color: var(--warn); }
    .event .tag.new { background: #dbeafe; color: #2563eb; }
    .event .tag.removed { background: #e5e7eb; color: var(--muted); }
    .event .tag.board_price { background: #ede9fe; color: #7c3aed; }
    .event .tag.board_availability { background: #fef3c7; color: var(--warn); }
    .event .detail { flex: 1; }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.4);
      display: none; align-items: center; justify-content: center; z-index: 20;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--card); border-radius: 12px; padding: 24px;
      width: min(720px, 92vw); max-height: 85vh; overflow: auto;
    }
    .modal h2 { font-size: 16px; margin-bottom: 4px; }
    .modal .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .modal canvas { max-height: 300px; }
    .modal .close {
      float: right; border: 1px solid var(--border); background: none;
      border-radius: 6px; padding: 4px 10px; cursor: pointer; color: var(--muted);
    }
    .login {
      max-width: 360px; margin: 15vh auto; background: var(--card);
      border: 1px solid var(--border); border-radius: 12px; padding: 28px;
    }
    .login h1 { font-size: 18px; margin-bottom: 16px; text-align: center; }
    .login input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; margin-bottom: 12px; font-size: 14px;
    }
    .login button {
      width: 100%; padding: 10px; background: var(--primary); color: #fff;
      border: none; border-radius: 8px; font-size: 14px; cursor: pointer;
    }
    .login button:hover { background: var(--primary-dark); }
    .login .err { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; }
    .empty { color: var(--muted); text-align: center; padding: 40px; font-size: 14px; }
    /* 价格面板 */
    .board-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .plan-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      cursor: pointer;
      transition: box-shadow .15s, transform .15s;
    }
    .plan-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); transform: translateY(-1px); }
    .plan-card .plan-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .plan-card .plan-name { font-size: 15px; font-weight: 700; }
    .plan-card .plan-name .fmt { font-weight: 400; font-size: 11px; color: var(--muted); margin-left: 4px; }
    .lvl-badge {
      font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    }
    .lvl-badge.high { background: #ecfdf5; color: var(--up); }
    .lvl-badge.medium { background: #fef3c7; color: var(--warn); }
    .lvl-badge.low { background: #fee2e2; color: var(--down); }
    .lvl-badge.none { background: #e5e7eb; color: var(--muted); }
    .plan-card .big-price { font-size: 26px; font-weight: 700; margin: 4px 0; }
    .plan-card .big-price .from { font-size: 12px; font-weight: 400; color: var(--muted); }
    .plan-card .price-stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px;
      font-size: 12px; color: var(--muted); margin-top: 10px;
    }
    .plan-card .price-stats b { color: var(--text); font-weight: 600; }
    .plan-card .token-line { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .plan-card .trend { font-size: 12px; margin-top: 4px; }
    .plan-card .trend.up { color: var(--up); }
    .plan-card .trend.down { color: var(--down); }
    /* 在售凸显 */
    .avail-line { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; margin: 2px 0 10px; }
    .avail-line .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .avail-line.on { color: #16a34a; }
    .avail-line.on .dot { background: #16a34a; box-shadow: 0 0 6px rgba(22,163,74,.55); }
    .avail-line.off { color: #9ca3af; }
    .avail-line.off .dot { background: #9ca3af; }
    .avail-line b { font-size: 24px; font-weight: 700; line-height: 1; }
    /* 顶部 tab */
    .tabs { display: flex; gap: 4px; margin-left: 24px; }
    .tab-btn {
      border: 1px solid var(--border); background: var(--card);
      color: var(--muted); border-radius: 8px; padding: 6px 16px;
      font-size: 14px; cursor: pointer; transition: all .15s;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    /* 分时走势 */
    .chart-hint { font-size: 12px; color: var(--muted); font-weight: 400; }
    .range-picker { display: inline-flex; gap: 2px; margin-left: 12px; vertical-align: middle; }
    .range-picker button {
      border: 1px solid var(--border); background: var(--card); color: var(--muted);
      border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer; transition: all .15s;
    }
    .range-picker button:hover { color: var(--text); }
    .range-picker button.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .chart-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .chart-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px; width: 100%;
    }
    .chart-card .chart-head {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin-bottom: 8px; flex-wrap: wrap;
    }
    .chart-card .chart-name { font-size: 15px; font-weight: 700; }
    .kline-toggles { display: flex; gap: 14px; font-size: 12px; margin-left: auto; align-items: center; }
    .kline-toggles label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; color: var(--muted); }
    .kline-toggles label:hover { color: var(--text); }
    .kline-toggles input { margin: 0; accent-color: #0d9488; }
    .kline-toggles .sw { width: 15px; height: 3px; border-radius: 2px; display: inline-block; }
    .kline-toggles b { color: var(--text); font-weight: 600; }
    .kline-toggles .tg-min b { color: #2563eb; }
    .kline-toggles .tg-med b { color: #0d9488; }
    .kline-toggles .tg-max b { color: #6b7280; }
    .chart-state { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .chart-wrap { position: relative; height: 580px; }
    .chart-wrap canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
    /* 大盘指数 */
    .index-card {
      background: linear-gradient(135deg, #0d9488, #0f766e);
      color: #fff;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .index-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .index-name { font-size: 13px; opacity: .85; }
    .index-value { font-size: 28px; font-weight: 700; }
    .index-change { font-size: 14px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: rgba(255,255,255,.15); }
    .index-change.up { color: #ffd7d7; }
    .index-change.down { color: #d9ffe6; }
    .index-sub { font-size: 12px; opacity: .7; margin-left: auto; }
    .index-chart-wrap { height: 70px; }
    .index-chart-wrap canvas { width: 100% !important; height: 100% !important; }
    /* 排行榜 */
    .rank-table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; font-size: 13px; }
    .rank-table th, .rank-table td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    .rank-table th { background: #f9fafb; font-weight: 600; color: var(--muted); white-space: nowrap; cursor: pointer; user-select: none; }
    .rank-table th:hover { color: var(--text); }
    .rank-table th.sorted { color: var(--primary); }
    .rank-table tr:hover td { background: #f9fafb; }
    .rank-table .rank { font-weight: 700; color: var(--primary); }
    .rank-table .merchant { font-weight: 600; }
    .rank-table .bio { color: var(--muted); font-size: 12px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-table .num { font-variant-numeric: tabular-nums; }
    .rank-table .up { color: var(--up); }
    .rank-table .down { color: var(--down); }
    @media (max-width: 640px) {
      main { padding: 12px; }
      header { padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <div class="banner" id="banner"></div>
  <div id="app-root">
    <div class="login" id="login-box">
      <h1>NVT 价格监控</h1>
      <input type="password" id="pass-input" placeholder="请输入访问口令">
      <button id="pass-btn">进入</button>
      <div class="err" id="login-err">口令错误</div>
    </div>
  </div>
  <div id="dashboard" style="display:none">
    <header>
      <h1>NVT 价格监控</h1>
      <nav class="tabs">
        <button class="tab-btn active" data-tab="overview">看板</button>
        <button class="tab-btn" data-tab="chart">分时走势</button>
        <button class="tab-btn" data-tab="rank">排行榜</button>
      </nav>
      <div class="status">
        <span id="collect-dot" class="dot"></span>
        <span id="collect-status">—</span>
        <span id="last-update" style="color:var(--muted)"></span>
      </div>
    </header>
    <main id="tab-overview">
      <div class="index-card" id="index-card" style="display:none">
        <div class="index-head">
          <span class="index-name">号池大盘指数</span>
          <span class="index-value" id="index-value">—</span>
          <span class="index-change" id="index-change"></span>
          <span class="index-sub" id="index-sub"></span>
        </div>
        <div class="index-chart-wrap"><canvas id="index-chart"></canvas></div>
      </div>
      <div class="section-title">平台价格面板</div>
      <div class="board-grid" id="board-grid"></div>
      <div class="section-title">商品</div>
      <div class="grid" id="grid"></div>
      <div class="section-title">最近变更</div>
      <div class="events" id="events"></div>
    </main>
    <main id="tab-chart" style="display:none">
      <div class="section-title">分时走势
        <span class="chart-hint" id="chart-hint">近 6 小时 · 每 45 秒更新</span>
        <span class="range-picker" id="range-picker">
          <button data-hours="1">1小时</button>
          <button data-hours="3">3小时</button>
          <button data-hours="6" class="active">6小时</button>
          <button data-hours="12">12小时</button>
          <button data-hours="24">24小时</button>
          <button data-hours="168">7天</button>
        </span>
        <span class="range-picker" id="period-picker">
          <button data-period="1">1分</button>
          <button data-period="5" class="active">5分</button>
          <button data-period="15">15分</button>
          <button data-period="60">1h</button>
          <button data-period="240">4h</button>
          <button data-period="1440">1d</button>
        </span>
      </div>
      <div class="chart-grid" id="chart-grid"></div>
    </main>
    <main id="tab-rank" style="display:none">
      <div class="section-title">商家排行榜
        <span class="chart-hint" id="rank-hint"></span>
      </div>
      <div id="rank-wrap"><div class="empty">加载中…</div></div>
    </main>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <button class="close" id="modal-close">关闭</button>
      <h2 id="modal-title"></h2>
      <div class="sub" id="modal-sub"></div>
      <canvas id="modal-chart"></canvas>
    </div>
  </div>

  <script src="/chart.umd.min.js"></script>
  <script src="/klinecharts.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
